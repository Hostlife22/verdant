<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@500;700&display=swap">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="wrapper">
        <div class="player">
            <div class="title">Now Playing</div>
            <div class="cover"><img src="./img/cover1.png" alt="cover" class="cover__img "></div>
            <div class="song">Brooklyn and the Bridge</div>
            <audio class="audio" src="./audio/Ennio Morricone.mp3"></audio>
            <div class="progress__container">
                <div class="progress"></div>
            </div>
            <div class="buttons">
                <div class="btn prev"><img src="./img/play-prev.svg" alt="btn"></div>
                <div class="btn play"><img class="img__src" src="./img/play.svg" alt="btn"></div>
                <div class="btn next"><img src="./img/play-next.svg" alt="btn"></div>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>

</html>
